name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://ledgerlab:${{ secrets.CI_POSTGRES_PASSWORD }}@127.0.0.1:5432/ledgerlab
    services:
      db:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: ledgerlab
          POSTGRES_USER: ledgerlab
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U ledgerlab -d ledgerlab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Verify lockfile and install dependencies
        run: uv sync --locked --dev

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest -q

      - name: Run linter
        run: uv run ruff check .

      - name: Run type checker
        run: uv run mypy src

      - name: Build container image
        run: docker build --tag ledgerlab:ci .
