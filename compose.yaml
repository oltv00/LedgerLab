name: ledgerlab

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/ledgerlab:dev
    ports:
      - "127.0.0.1:8000:8000"
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ledgerlab
      POSTGRES_USER: ledgerlab
      POSTGRES_PASSWORD: ledgerlab
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerlab -d ledgerlab"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
